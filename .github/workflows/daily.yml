name: 每日股票分析

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 週一到週五 台灣時間 15:30（收盤後）
  workflow_dispatch:          # 也可在 GitHub 上手動執行

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 執行分析
        env:
          HOLDINGS: ${{ secrets.HOLDINGS }}
        run: python analyze.py
      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "每日分析 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -q && git push
      - name: LINE 推播日報
        id: line
        if: env.LINE_CHANNEL_ACCESS_TOKEN != ''
        continue-on-error: true
        run: python line_daily.py docs/data.json
      - name: 備援：建立 Issue（未設定 LINE 或推播失敗時，GitHub 會寄 Email）
        if: env.LINE_CHANNEL_ACCESS_TOKEN == '' || steps.line.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-report --color 2e6bd8 --description "每日台股日報" 2>/dev/null || true
          for n in $(gh issue list --label daily-report --state open --json number --jq '.[].number'); do
            gh issue close "$n"
          done
          gh issue create --title "台股日報 $(TZ=Asia/Taipei date +%F)" --body-file report.md \
            --label daily-report --assignee "${{ github.repository_owner }}"
