<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的台股日報</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #667085; --line: #e4e7ec;
  --up: #d92d20; --down: #079455; --accent: #2e6bd8; --warn: #b54708;
  --chip-up: #fef3f2; --chip-down: #ecfdf3; --chip-n: #f2f4f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #98a2b3; --line: #2a2f37;
    --up: #f97066; --down: #47cd89; --accent: #6b9cf0; --warn: #fdb022;
    --chip-up: #3a1a18; --chip-down: #12301f; --chip-n: #252a32;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { font-size: 24px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; }
h2 { font-size: 18px; margin: 28px 0 10px; display: flex; align-items: baseline; gap: 8px; }
h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.name { font-weight: 600; font-size: 16px; }
.code { color: var(--muted); font-size: 13px; margin-left: 6px; font-weight: 400; }
.price { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.b-偏多 { background: var(--chip-up); color: var(--up); }
.b-中性偏多 { background: var(--chip-up); color: var(--up); opacity: .85; }
.b-中性 { background: var(--chip-n); color: var(--muted); }
.b-偏弱 { background: var(--chip-down); color: var(--down); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; margin: 6px 0; font-variant-numeric: tabular-nums; }
ul.sig { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13.5px; }
ul.sig li { padding-left: 18px; position: relative; margin: 2px 0; }
ul.sig li::before { position: absolute; left: 0; }
li.pos::before { content: "▲"; color: var(--up); font-size: 11px; top: 3px; }
li.neg::before { content: "▼"; color: var(--down); font-size: 11px; top: 3px; }
svg.spark { width: 100%; height: 44px; display: block; margin-top: 8px; }
.empty { color: var(--muted); font-size: 14px; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; }
.note { margin-top: 36px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
.ret { font-size: 13px; font-weight: 600; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .t { color: var(--muted); font-size: 12.5px; }
.tile .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .c { font-size: 12.5px; font-variant-numeric: tabular-nums; }
#usmacro { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.pill b { font-variant-numeric: tabular-nums; }
.cal { list-style: none; margin: 0; padding: 0; }
.cal li { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.cal li:last-child { border-bottom: 0; }
.cal .dt { font-weight: 600; min-width: 64px; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip-n); color: var(--muted); margin-left: auto; white-space: nowrap; align-self: center; }
.tablewrap { overflow-x: auto; padding: 4px 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
.news ul { list-style: none; margin: 8px 0 0; padding: 0; }
.news li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.news li:last-child { border-bottom: 0; }
.news a { color: var(--text); text-decoration: none; }
.news a:hover { color: var(--accent); text-decoration: underline; }
.news .src { color: var(--muted); font-size: 12px; display: block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>我的台股日報</h1>
    <div class="meta" id="meta">載入中…</div>
  </header>

  <section id="intraday" hidden>
    <h2>盤中訊號 <small id="intraday-sub"></small></h2>
    <div class="card tablewrap" id="intraday-list"></div>
  </section>

  <section id="market"></section>

  <h2>我的持股 <small>持有中的股票今日訊號</small></h2>
  <div class="grid" id="holdings"></div>

  <h2>國際市場・利率・原物料 <small>影響台股資金面的關鍵指標</small></h2>
  <div class="tiles" id="global"></div>
  <div id="usmacro"></div>

  <h2>未來 30 天財經日曆</h2>
  <div class="card" id="calendar"></div>

  <h2>月營收追蹤 <small>★ 為持股</small></h2>
  <div class="card tablewrap" id="revenue"></div>

  <h2>新聞焦點 <small>川普、總經、科技大廠、持股</small></h2>
  <div class="grid news" id="news"></div>

  <h2>今日可留意的進場標的 <small id="picks-sub"></small></h2>
  <div class="grid" id="picks"></div>

  <h2>觀察清單</h2>
  <div class="grid" id="watchlist"></div>

  <p class="note">
    本頁由程式依技術指標（均線、RSI、KD、MACD、成交量）自動產生，僅供學習與參考，<b>不構成任何投資建議</b>。
    技術指標無法預測消息面與突發事件，進場前請自行判斷並控制部位與風險。
    「參考停損」= 收盤價 − 2 × ATR(14)。
  </p>
</main>
<script>
const fmt = (n, d = 2) => Number(n).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const sign = n => (n > 0 ? "+" : "") + fmt(n) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const w = 300, h = 44, min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 3 - (v - min) / r * (h - 6)).toFixed(1)}`).join(" ");
  const color = vals[vals.length - 1] >= vals[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function card(s, showReturn) {
  const sigs = [...s.bull.map(t => `<li class="pos">${esc(t)}</li>`), ...s.bear.map(t => `<li class="neg">${esc(t)}</li>`)].join("");
  const ret = showReturn && s.return_pct != null
    ? `<span class="ret ${cls(s.return_pct)}">報酬 ${sign(s.return_pct)}</span>` : "";
  return `<div class="card">
    <div class="row"><div class="name">${esc(s.name)}<span class="code">${esc(s.code)}</span></div>
      <span class="badge b-${esc(s.verdict)}">${esc(s.verdict)}・${s.score > 0 ? "+" : ""}${s.score}</span></div>
    <div class="row" style="margin-top:4px"><div><span class="price">${fmt(s.close)}</span>
      <span class="${cls(s.change_pct)}" style="margin-left:6px">${sign(s.change_pct)}</span></div>${ret}</div>
    <div class="stats"><span>月線 ${fmt(s.ma20)}</span><span>季線 ${fmt(s.ma60)}</span>
      <span>RSI ${fmt(s.rsi, 0)}</span><span>K/D ${fmt(s.k, 0)}/${fmt(s.d, 0)}</span><span>參考停損 ${fmt(s.stop)}</span></div>
    ${spark(s.spark)}
    <ul class="sig">${sigs || '<li>今日無明顯訊號</li>'}</ul>
  </div>`;
}

function fill(id, list, showReturn, emptyMsg) {
  document.getElementById(id).innerHTML = list.length
    ? list.map(s => card(s, showReturn)).join("")
    : `<div class="empty">${emptyMsg}</div>`;
}

function renderMacro(d) {
  const $ = id => document.getElementById(id);
  $("global").innerHTML = (d.global || []).map(x => {
    const y = x.kind === "yield";
    const v = y ? x.value.toFixed(3) + "%" : fmt(x.value);
    const c = y ? `${x.chg > 0 ? "+" : ""}${x.chg.toFixed(1)} bp` : sign(x.chg);
    const c5 = y ? `${x.chg5 > 0 ? "+" : ""}${x.chg5.toFixed(1)} bp` : sign(x.chg5);
    return `<div class="tile"><div class="t">${esc(x.name)}</div><div class="v">${v}</div>
      <div class="c"><span class="${cls(x.chg)}">日 ${c}</span>　<span class="${cls(x.chg5)}">週 ${c5}</span></div></div>`;
  }).join("") || '<div class="empty">今日無法取得國際市場資料。</div>';

  $("usmacro").innerHTML = (d.us_macro || []).map(x =>
    `<span class="pill">${esc(x.name)} <b>${esc(x.value)}</b> <span style="color:var(--muted)">前期 ${esc(x.prev)}・${esc(x.period)}</span></span>`).join("");

  const tagName = { macro: "總經", earnings: "財報/法說", revenue: "營收" };
  $("calendar").innerHTML = (d.calendar || []).length
    ? `<ul class="cal">${d.calendar.map(e => `<li><span class="dt">${esc(e.date.slice(5))}</span><span>${esc(e.event)}</span>
        <span class="tag">${tagName[e.type] || ""}</span></li>`).join("")}</ul>`
    : "近期無已知重要事件。";

  const rev = [...(d.revenue || [])].sort((a, b) => (b.holding - a.holding) || (b.yoy - a.yoy));
  $("revenue").innerHTML = rev.length ? `<table><thead><tr><th>公司</th><th>月份</th><th>營收(億)</th><th>月增</th><th>年增</th><th>累計年增</th></tr></thead>
    <tbody>${rev.map(r => `<tr title="${esc(r.note)}"><td>${r.holding ? "★ " : ""}${esc(r.code)} ${esc(r.name)}</td><td>${esc(r.period)}</td>
      <td>${fmt(r.revenue, 1)}</td><td class="${cls(r.mom)}">${sign(r.mom)}</td><td class="${cls(r.yoy)}">${sign(r.yoy)}</td>
      <td class="${cls(r.ytd_yoy)}">${sign(r.ytd_yoy)}</td></tr>`).join("")}</tbody></table>` : "無營收資料。";

  $("news").innerHTML = (d.news || []).map(s => `<div class="card"><div class="name">${esc(s.topic)}</div><ul>
    ${s.items.map(n => `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <span class="src">${esc(n.source)}・${esc(n.time)}</span></li>`).join("")}</ul></div>`).join("")
    || '<div class="empty">今日無新聞資料。</div>';
}

fetch("intraday.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(s => {
  if (!s) return;
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const $ = id => document.getElementById(id);
  $("intraday").hidden = false;
  $("intraday-sub").textContent = `${s.date === today ? "今日" : s.date}・最後檢查 ${s.updated.slice(11)}・每 15 分鐘更新`;
  const act = { "出場警示": "down", "進場訊號": "up", "加碼參考": "up" };
  const rows = (s.alerts || []).map(a => `<tr><td>${esc(a.at)}</td><td>${esc(a.code)} ${esc(a.name)}</td>
    <td class="${act[a.action]}" style="text-align:left;font-weight:600">${esc(a.action)}</td>
    <td>${fmt(a.price)}</td><td class="${cls(a.change_pct)}">${sign(a.change_pct)}</td>
    <td style="text-align:left;white-space:normal">${a.signals.map(esc).join("、")}</td></tr>`).join("");
  $("intraday-list").innerHTML = rows
    ? `<table><thead><tr><th>時間</th><th>股票</th><th style="text-align:left">類型</th><th>價格</th><th>漲跌</th><th style="text-align:left">訊號</th></tr></thead><tbody>${rows}</tbody></table>`
    : "目前沒有新的進出場訊號。";
}).catch(() => {});

fetch("data.json?t=" + Date.now()).then(r => r.json()).then(d => {
  document.getElementById("meta").textContent = `更新時間 ${d.updated}（台灣時間）・今日掃描 ${d.scanned} 檔成交熱絡股票`;
  if (d.market) {
    const m = d.market;
    document.getElementById("market").innerHTML = `<h2>大盤 <small>加權指數</small></h2>
      ${card({ ...m, name: "加權指數", code: "TAIEX", k: NaN, d: NaN, stop: NaN }, false)
        .replace(/<span>K\/D[^<]*<\/span><span>參考停損[^<]*<\/span>/, "")}`;
  }
  fill("holdings", d.holdings, true, "尚未設定持股。請在 GitHub Secret「HOLDINGS」或本機 holdings.json 填入持股。");
  renderMacro(d);
  document.getElementById("picks-sub").textContent = "依技術面評分排序，分數越高訊號越多";
  fill("picks", d.picks, false, "今天沒有符合條件的標的，觀望也是一種策略。");
  fill("watchlist", d.watchlist, false, "觀察清單是空的，可在 config.json 的 watchlist 加入股票代號。");
}).catch(() => { document.getElementById("meta").textContent = "資料載入失敗，請稍後重新整理。"; });
</script>
</body>
</html>
